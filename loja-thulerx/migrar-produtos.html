const logDiv = document.getElementById('log');
const btn = document.getElementById('btn-migrate');

function log(msg) {
  logDiv.textContent += msg + "\n";
}

window.migrate = async function() {
  btn.disabled = true;

  // Precisa estar logado como equipe (mesma conta usada em team.html)
  // para ter permissão de escrita, dependendo das suas regras do Firestore.
  const email = prompt("E-mail da conta da equipe:");
  const password = prompt("Senha da conta da equipe:");

  try {
    if (email && password) {
      await signInWithEmailAndPassword(auth, email, password);
      log("✅ Login feito com sucesso.");
    }
  } catch (e) {
    log("⚠️ Não foi possível logar (" + e.message + "). Tentando migrar mesmo assim...");
  }

  log(`Iniciando migração de ${products.length} produtos...`);

  for (const product of products) {
    try {
      const { id, ...data } = product;
      await setDoc(doc(db, "products", String(id)), data);
      log(`✅ ${product.name} migrado (estoque: ${product.stock})`);
    } catch (e) {
      log(`❌ Erro ao migrar ${product.name}: ${e.message}`);
    }
  }

  log("\n🎉 Migração concluída! Confira a coleção 'products' no Firebase Console.");
  log("Agora você já pode apagar este arquivo do repositório.");
};
